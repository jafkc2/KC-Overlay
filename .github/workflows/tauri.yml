name: Rust

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Enable static CRT linkage
      run: |
        mkdir .cargo
        echo '[target.x86_64-pc-windows-msvc]' >> .cargo/config.toml
        echo 'rustflags = ["-Ctarget-feature=+crt-static"]' >> .cargo/config.toml
    - name: Install dependencies
      run: npm install
    - name: Build
      run: npm run tauri build
    - name: Rename binary
      run: ren src-tauri\target\release\KC-Overlay.exe KC-Overlay-Windows.exe
    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: KC-Overlay-Windows
        path: src-tauri/target/release/KC-Overlay.exe

  build_windows32:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Enable static CRT linkage
      run: |
        mkdir .cargo
        echo '[target.i686-pc-windows-msvc]' >> .cargo/config.toml
        echo 'rustflags = ["-Ctarget-feature=+crt-static"]' >> .cargo/config.toml
    - name: Install dependencies
      run: npm install
    - name: Install 32 bits toolchain
      run: rustup target add i686-pc-windows-msvc
    - name: Build
      run: npm run tauri build -- --target i686-pc-windows-msvc
    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: KC-Overlay-Windows-32
        path: src-tauri/target/i686-pc-windows-msvc/release/KC-Overlay.exe

  build_linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - name: Install project dependencies
      run: npm install
    - name: Build
      run: npm run tauri build
    - name: Make binary executable
      run: chmod +x src-tauri/target/release/KC-Overlay
    - name: Rename binary
      run: mv src-tauri/target/release/KC-Overlay src-tauri/target/release/KC-Overlay-Linux
    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: KC-Overlay-Linux
        path: src-tauri/target/release/KC-Overlay


  build_macos:

    runs-on: macos-15-intel

    steps:
    - uses: actions/checkout@v4
    - name: Install project dependencies
      run: npm install
    - name: Build
      env:
        MACOSX_DEPLOYMENT_TARGET: 10.14
      run: npm run tauri build
    - name: Make binary executable
      run: chmod +x src-tauri/target/release/KC-Overlay
    - name: Rename binary
      run: mv src-tauri/target/release/KC-Overlay src-tauri/target/release/KC-Overlay-MacOS-Intel
    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: KC-Overlay-MacOS-Intel
        path: src-tauri/target/release/KC-Overlay

  create_release:
      permissions:
        contents: write
      needs: [build_windows, build_linux, build_macos]
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Download Windows 64-bit
          uses: actions/download-artifact@v4
          with:
            name: KC-Overlay-Windows
            path: ./release-assets

        - name: Download Linux
          uses: actions/download-artifact@v4
          with:
            name: KC-Overlay-Linux
            path: ./release-assets

        - name: Download MacOS
          uses: actions/download-artifact@v4
          with:
            name: KC-Overlay-MacOS-Intel
            path: ./release-assets

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            body: |
              Acesse o servidor do Discord para ver detalhes sobre esta versão.
              
              as builds desta versão foram geradas através desta Github Action: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            generate_release_notes: true
            files: ./release-assets/*
