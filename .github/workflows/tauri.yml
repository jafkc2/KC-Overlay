name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Enable static CRT linkage
      run: |
        mkdir .cargo
        echo '[target.x86_64-pc-windows-msvc]' >> .cargo/config.toml
        echo 'rustflags = ["-Ctarget-feature=+crt-static"]' >> .cargo/config.toml
    - name: Install dependencies
      run: npm install
    - name: Build
      run: npm run tauri build
    - name: Add signtool to PATH
      run: |
        $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
        $latest = Get-ChildItem $signtool -Directory | Sort-Object Name -Descending | Select-Object -First 1
        $arch = "x64"  # Or "x86" if you're building 32-bit apps
        $toolPath = Join-Path -Path $latest.FullName -ChildPath $arch
        echo "$toolPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh
    - name: Decode self-signed certificate from base64
      run: |
        echo "${{ secrets.CODE_SIGNING_PFX }}" | base64 --decode > mycode-signing.pfx
      shell: bash
    - name: Sign binary with self-signed certificate
      run: |
        signtool sign /f mycode-signing.pfx /p "${{ secrets.CERTIFICATE_PASSWORD }}" `
          /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 src-tauri/target/release/KC-Overlay.exe
    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: KC-Overlay-Windows
        path: src-tauri/target/release/KC-Overlay.exe

  build_linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - name: Install project dependencies
      run: npm install
    - name: Build
      run: npm run tauri build
    - name: Make binary executable
      run: chmod +x src-tauri/target/release/KC-Overlay
    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: KC-Overlay-Linux
        path: src-tauri/target/release/KC-Overlay


  build_macos:

    runs-on: macos-13

    steps:
    - uses: actions/checkout@v4
    - name: Install project dependencies
      run: npm install
    - name: Build
      env:
        MACOSX_DEPLOYMENT_TARGET: 10.14
      run: npm run tauri build
    - name: Make binary executable
      run: chmod +x src-tauri/target/release/KC-Overlay
    - name: Archive binary
      uses: actions/upload-artifact@v4
      with:
        name: KC-Overlay-MacOS-Intel
        path: src-tauri/target/release/KC-Overlay
